<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Childer' ;
            src: url(fonts/Childer.otf) format(opentype);
            font-weight: normal;
            font-style: normal;

            /*  Tipos de format()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced Typograph)
            - svg 
            
            Caso tenha mais de um formato pode continuar adicionando mais url e format
            
            font-family: ;
            src: url(fonts/Childer.otf) format(opentype), url(fonts/Childer.ttf) formats (truetype)...;*/
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'Childer', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Omnis dolore, voluptatum autem neque ducimus iusto aperiam natus rem possimus eligendi aspernatur corporis sunt maxime dolorum iure repellat. Dolores, id inventore.</p>
</body>
</html>
